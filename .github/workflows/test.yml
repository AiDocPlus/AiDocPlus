name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  # ── 前端：类型检查 + Lint + 单元测试 ──
  frontend:
    name: Frontend (tsc + lint + vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build resources
        run: bash scripts/build-resources.sh

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript type check
        working-directory: apps/desktop/src-ui
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: apps/desktop/src-ui
        run: pnpm lint
        continue-on-error: true

      - name: Unit tests (Vitest)
        working-directory: apps/desktop/src-ui
        run: pnpm test -- --reporter=verbose

  # ── Rust：编译检查 + clippy + 单元测试 ──
  rust:
    name: Rust (check + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libspeechd-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target
          cache-all-crates: true
          cache-on-failure: true

      - name: Build resources
        run: bash scripts/build-resources.sh

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend (needed for Tauri)
        working-directory: apps/desktop/src-ui
        run: pnpm build

      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-features

      - name: Cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -W clippy::unwrap_used
        continue-on-error: true

      - name: Cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test
